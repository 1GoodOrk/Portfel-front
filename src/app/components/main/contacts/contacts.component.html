<app-header></app-header>
<main class="contacts">
  <div class="form-container row">
    <div class="form-container column w-half">
      <div class="form-group w-300">
        <label for="name">Email</label>
        <input pInputText id="email" placeholder="Email" [(ngModel)]="formData.email" />
      </div>
      <div class="form-group w-300">
        <label for="subinfo">Theme</label>
        <input pInputText id="theme" placeholder="Theme" [(ngModel)]="formData.theme" />
      </div>
      <div class="form-group w-300">
        <label for="comment">Comment</label>
        <textarea id="comment" placeholder="Comment" [(ngModel)]="formData.comment"></textarea>
      </div>
      <div>
        <p-button label="Send" [outlined]="true" severity="success" (click)="sendMessage()" />
      </div>
    </div>
  </div>
</main>
<app-footer></app-footer>
