<app-header></app-header>
<main class="balance">
  <div class="flex space-evenly">
    <p-button
      icon="pi pi-eye"
      [label]="`${'pages.project.science.watchProject' | translate}`"
      tooltipPosition="top"
      severity="secondary"
      (click)="showInfoProjectDialog($event)"/>
  </div>
  <p-stepper [value]="1" class="basis-200" [linear]="true">
    <p-step-list>
      <p-step [value]="1">Стейкхолдери</p-step>
      <p-step [value]="2">Конфлікти</p-step>
      <p-step [value]="3">Рішення</p-step>
      <p-step [value]="4">Висновок</p-step>
    </p-step-list>
    <p-step-panels>
      <p-step-panel [value]="1">
        <ng-template #content let-activateCallback="activateCallback">
          <div class="flex flex-col h-48">
            <app-stackholder-balance></app-stackholder-balance>
          </div>
          <div class="flex pt-5 justify-end">
            <button type="button" pButton (click)="activateCallback(2)">Далі <i class="pi pi-arrow-right"></i></button>
          </div>
        </ng-template>
      </p-step-panel>
      <p-step-panel [value]="2">
        <ng-template #content let-activateCallback="activateCallback">
          <div class="flex flex-col h-48">
            <app-conflict></app-conflict>
          </div>
          <div class="flex pt-5 justify-between">
            <button type="button" pButton severity="secondary" (click)="activateCallback(1)"><i class="pi pi-arrow-left"></i> Назад</button>
            <button type="button" pButton (click)="activateCallback(3)">Далі <i class="pi pi-arrow-right"></i></button>
          </div>
        </ng-template>
      </p-step-panel>
      <p-step-panel [value]="3">
        <ng-template #content let-activateCallback="activateCallback">
          <div class="flex flex-col h-48">
            <app-solution></app-solution>
          </div>
          <div class="flex pt-5 justify-between">
            <button type="button" pButton severity="secondary" (click)="activateCallback(2)"><i class="pi pi-arrow-left"></i> Назад</button>
            <button type="button" pButton (click)="activateCallback(4)">Далі <i class="pi pi-arrow-right"></i></button>
          </div>
        </ng-template>
      </p-step-panel>
      <p-step-panel [value]="4">
        <ng-template #content let-activateCallback="activateCallback">
          <div class="flex flex-col h-48">
            <app-result></app-result>
          </div>
          <div class="flex pt-5 justify-start">
            <button type="button" pButton severity="secondary" (click)="activateCallback(3)"><i class="pi pi-arrow-left"></i> Назад</button>
          </div>
        </ng-template>
      </p-step-panel>
    </p-step-panels>
  </p-stepper>

</main>
<app-footer></app-footer>
<app-info-dialog [visible]="visible.project" [currentProject]="currentProject" (changeVisibleEvent)="visibleOnChange($event)"></app-info-dialog>
